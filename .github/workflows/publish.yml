name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Check distributions with twine
      run: |
        python -m pip install twine
        python -m twine check dist/*

    - name: Verify wheel version matches release tag
      if: github.event_name == 'release'
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        WHEEL_VERSION="$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3\.whl/\1/')"
        echo "Release tag version: $TAG"
        echo "Wheel version:        $WHEEL_VERSION"
        if [ "$TAG" != "$WHEEL_VERSION" ]; then
          echo "::error::Version mismatch — bump version in setup.py to $TAG, commit, and re-publish the release."
          exit 1
        fi

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Trusted Publishing (PEP 740): no API token needed on PyPI's side.
      id-token: write

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
